name: AI Code Review
description: Reviews a pull request using Claude AI against 5 stack-specific criteria

inputs:
  github-token:
    description: GitHub token for posting comments and managing labels
    required: true
  anthropic-api-key:
    description: Anthropic API key
    required: true
  pr-number:
    description: Pull request number
    required: true
  pr-title:
    description: Pull request title
    required: true
  pr-body:
    description: Pull request body
    required: false
    default: ''
  base-ref:
    description: Base branch ref (e.g. main)
    required: true

runs:
  using: composite
  steps:
    - name: Collect filtered diff
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        git -C "$GITHUB_WORKSPACE" diff "origin/$BASE_REF"...HEAD -- '*.kt' '*.gradle' > "$RUNNER_TEMP/review_diff_$GITHUB_RUN_ID.txt"

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        # npm ci uruchamiamy w katalogu akcji, nie w korzeniu repo. Automatyczne
        # cache'owanie z setup-node v5+ szukałoby lockfile'a w korzeniu, więc
        # wyłączamy je jawnie, żeby przyszła zmiana w root package.json nie wywróciła CI.
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Run review script
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        BASE_REF: ${{ inputs.base-ref }}
        DIFF_PATH: ${{ runner.temp }}/review_diff_${{ github.run_id }}.txt
      run: node index.js
