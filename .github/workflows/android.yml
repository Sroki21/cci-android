name: CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # testDebugUnitTest nie kompiluje app/src/androidTest — bez tego kroku zepsuta
      # kompilacja testów instrumentowanych (8 plików) przechodziłaby przez CI niezauważona.
      - name: Compile instrumented tests
        run: ./gradlew compileDebugAndroidTestKotlin

      - name: Run Android Lint
        run: ./gradlew lintDebug
